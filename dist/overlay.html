<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lyrics</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 0 24px 10px; box-sizing: border-box; text-align: center;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #fff;
  }
  .line {
    max-width: 100%; transition: opacity .25s ease, transform .25s ease;
    text-shadow: 0 0 2px #000, 0 0 6px rgba(0,0,0,.9), 0 2px 12px rgba(0,0,0,.7);
    -webkit-text-stroke: .6px rgba(0,0,0,.55);
    display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
  }
  #now { font-size: 38px; font-weight: 700; line-height: 1.2; -webkit-line-clamp: 2; }
  #next { font-size: 22px; font-weight: 600; line-height: 1.3; opacity: .6; margin-top: 6px; -webkit-line-clamp: 1; min-height: 1.3em; }
  .fade { opacity: 0 !important; transform: translateY(6px); }
  .dim { opacity: .75; font-size: 26px !important; font-weight: 600 !important; }
</style>
</head>
<body>
<div id="now" class="line"></div>
<div id="next" class="line"></div>
<script>
  // Driven from Rust via eval: oxide.set(...) for lyrics, oxide.sync(...) for the clock.
  const now = document.getElementById('now');
  const next = document.getElementById('next');
  let lines = [], message = '', hideTimer = 0, clock = { at: 0, base: 0, paused: true }, shown = -2;

  // Run ahead of the last report by at most 1.5 s. The app reports every
  // second, so a stall (buffering, a loading track) freezes the lyrics
  // instead of letting them run on without the music.
  function position() {
    if (clock.paused) return clock.base;
    return clock.base + Math.min(1.5, (performance.now() - clock.at) / 1000);
  }

  function show(a, b, dim) {
    if (now.textContent === a && next.textContent === b) return;
    now.classList.add('fade');
    setTimeout(() => {
      now.textContent = a;
      next.textContent = b;
      now.classList.toggle('dim', !!dim);
      now.classList.remove('fade');
    }, 120);
  }

  function render() {
    if (!lines.length) {
      if (shown !== -1) { shown = -1; show(message, '', true); }
      return;
    }
    const t = position();
    let idx = -1;
    for (let i = 0; i < lines.length && lines[i][0] <= t; i++) idx = i;
    if (idx === shown) return;
    shown = idx;
    const cur = idx >= 0 ? lines[idx][1] : '';
    const upcoming = lines[idx + 1] ? lines[idx + 1][1] : '';
    show(cur || '♪', upcoming, !cur);
  }

  window.oxide = {
    set(data) {
      lines = data.lines || [];
      message = data.message || '';
      clearTimeout(hideTimer);
      if (data.transient) hideTimer = setTimeout(() => { message = ''; shown = -2; render(); }, 4000);
      shown = -2;
      render();
    },
    sync(elapsed, paused) {
      clock = { at: performance.now(), base: elapsed, paused };
      shown = -2;
      render();
    },
  };
  setInterval(render, 100);
</script>
</body>
</html>
