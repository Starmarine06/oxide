[package]
name = "oxide"
version = "0.1.0"
description = "A YouTube Music desktop client with plugins, written in Rust"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "oxide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tiny_http = "0.12"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
discord-rich-presence = "1.1"
dirs = "6"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
souvlaki = { version = "0.9", default-features = false }
